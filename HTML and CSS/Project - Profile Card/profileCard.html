<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="info">
            <img width="50px" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSK37IV4KOSnzD7cU-y7elXHplnzMuMBRcxJHOX8ND2pbUMe8GclgxLMbtjSoQuSjFJiarfr4dak9gyvnZTlRS_1NTYi9OMAWjR46BbBw&s=10" alt="profile photo" class="avatar">
            <h2 class="name">Ajay</h2>
            <p class="role">Full Stack Developer</p>
            <p class="bio">Java + Spring Boot + React</p>
            <div class="actions">
                <button class="btn btn-primary">Follow</button>
                <button class="btn btn-secondary">Message</button>
            </div>
        </div>
    </div>
</body>
</html>
